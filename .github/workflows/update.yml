name: Update data and deploy

# The data build is started by the relay's timer on Cloudflare (worker/timer.ts): every
# 10 minutes while Premier League matches are usually on, hourly otherwise. GitHub's own
# schedule below is only a fallback, as it runs late and pauses after 60 days without commits.
on:
  workflow_dispatch:
    inputs:
      trigger:
        description: What started the run ("timer" from the relay)
        default: manual
  schedule:
    - cron: '23 */3 * * *'
  push:
    branches: [main]

permissions: {} # each job asks for what it needs

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Timer and scheduled runs only refresh the data, and only deploy when it changed.
  UNATTENDED: ${{ github.event_name == 'schedule' || inputs.trigger == 'timer' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit a finished season's archive, once a season
    outputs:
      deploy: ${{ steps.data.outputs.changed == 'true' || env.UNATTENDED != 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check, lint and test
        if: env.UNATTENDED != 'true'
        run: npm run check

      # data.json isn't kept in git: the build starts from the copy on the live site, for
      # the pre-match odds it froze and to tell whether anything changed, and from its stats
      # files, for the moments of the matches already over.
      - name: Build data.json from the FPL Draft API
        id: data
        run: |
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          curl -fsS "$site/data.json?v=$(date +%s)" -o public/data.json || echo "No data.json on the site yet"
          # And each gameweek's stats file, for the moments of the matches already over.
          mkdir -p public/stats
          for gw in $(seq 1 38); do curl -fsS "$site/stats/$gw.json?v=$(date +%s)" -o "public/stats/$gw.json" 2>/dev/null || rm -f "public/stats/$gw.json"; done
          before=$(sha256sum public/data.json 2>/dev/null || true)
          npm run data
          after=$(sha256sum public/data.json)
          echo "changed=$([ "$before" != "$after" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          LEAGUE_ID: ${{ vars.LEAGUE_ID || '23793' }}

      # A season that has just finished is frozen into public/seasons/<2026-27>.json.
      - name: Commit a new season archive
        run: |
          git add -- public/seasons # index.json is generated each time and ignored
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Archive the season"
          git pull --rebase origin main # in case code was pushed while this ran
          git push

      - name: Bundle the page, its styles and the service worker into public/
        if: steps.data.outputs.changed == 'true' || env.UNATTENDED != 'true'
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: steps.data.outputs.changed == 'true' || env.UNATTENDED != 'true'
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
